# Cloudflare Pages 的配置（网页 + /api 服务端功能）。名字要和 Cloudflare 上的项目名一致。
name = "home-kitchen"
pages_build_output_dir = "dist"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 用哪家模型在这里改，推到 GitHub 后自动生效，手机端不用动（SPEC §3、§6）。
#   AI_PROVIDER = "anthropic"          Claude，AI_MODEL 留空默认 claude-opus-5-5
#   AI_PROVIDER = "openai-compatible"  通义 / 豆包 / OpenAI 等，必须同时填 AI_BASE_URL 和 AI_MODEL
#   AI_PROVIDER = "mock"               不调用任何模型，返回固定的示例结果
# 密钥不要写在这里：在 Cloudflare 后台 Pages 项目 → Settings → Variables and Secrets 里
# 添加类型为 Secret 的 APP_TOKEN 和 AI_KEY。
# 现在用的是 DeepSeek（能看图的 deepseek-flash）。AI_KEY 在 Cloudflare 后台设置为 Secret。
[vars]
AI_PROVIDER = "openai-compatible"
AI_BASE_URL = "https://api.deepseek.com"
AI_MODEL = "deepseek-flash"
