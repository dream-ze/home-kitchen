<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>入库确认</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E7A4B}a:hover{color:#245F3B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F1; color: #18201B; font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif; position: relative; overflow: hidden">

<div aria-hidden="true" style="padding: 24px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5B6660">本周 5 道菜 · 已勾选 3 / 9</span>
<span style="font-size: 30px; font-weight: 700">购物清单</span>
</div>
<a href="Shopping.dc.html" aria-label="关闭入库确认" style="position: absolute; inset: 0; background: rgba(20, 26, 22, 0.45)"></a>

<section aria-label="放进冰箱" style="position: absolute; left: 0; right: 0; bottom: 0; top: 96px; background: #F4F5F1; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">

<div aria-hidden="true" style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 5px; border-radius: 3px; background: #C9CFC6"></span></div>

<header style="display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 20px 0">
<div style="display: flex; flex-direction: column; gap: 3px">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">放进冰箱</h1>
<span style="font-size: 13px; color: #5B6660">位置和到期日已按食材填好，核对一下就行</span>
</div>
<a href="Shopping.dc.html" aria-label="关闭" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end; color: #5B6660">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</header>

<div style="flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 10px; padding: 14px 20px 0">

<sc-for list="{{items}}" as="it" hint-placeholder-count="2">
<div style="background: #FFFFFF; border-radius: 18px; padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 17px; font-weight: 500">{{it.name}}</span>
<label style="display: flex; align-items: center; gap: 4px; font-size: 14px; color: #5B6660">数量
<input value="{{it.qty}}" style="width: 64px; height: 36px; border-radius: 10px; border: 1px solid #E3E6E0; text-align: center; font-size: 15px; font-family: inherit; color: #18201B">
</label>
</div>
<div role="radiogroup" aria-label="存放位置" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{it.locs}}" as="l" hint-placeholder-count="3">
<button role="radio" aria-checked="{{l.checked}}" onClick="{{l.pick}}" style="{{l.style}}">{{l.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="{{it.expStyle}}">{{it.exp}}</span>
<button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #D5DAD3; background: #FFFFFF; color: #18201B; font-size: 13px; font-family: inherit">改日期</button>
</div>
</div>
</sc-for>

<div style="background: #FFFFFF; border-radius: 18px; padding: 14px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 17px; font-weight: 500">八角 <span style="font-size: 14px; color: #5B6660; font-weight: 400">1 包</span></span>
<span style="font-size: 12px; color: #5B6660">常备品，不记数量和到期日</span>
</div>
<span style="font-size: 12px; color: #245F3B; background: #E6F1EA; border-radius: 999px; padding: 4px 10px">标记为 有</span>
</div>

</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 20px 30px; background: #FFFFFF; border-top: 1px solid #E3E6E0">
<span style="font-size: 12px; color: #5B6660">改过的位置会记住，下次买同一种食材自动套用</span>
<a href="Fridge.dc.html" style="height: 52px; border-radius: 16px; background: #2E7A4B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700">放进冰箱（3 样）</a>
</div>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { loc: { tomato: 0, tofu: 0 } };
}
renderVals() {
var self = this;
var loc = (this.state && this.state.loc) || { tomato: 0, tofu: 0 };
var labels = ['冷藏', '冷冻', '常温'];
var base = [
{ id: 'tomato', name: '番茄', qty: '4 个', days: [7, 60, 5] },
{ id: 'tofu', name: '嫩豆腐', qty: '1 盒', days: [3, 30, 1] }
];
var dateOf = function (d) {
var dt = new Date(2026, 9, 20 + d);
return (dt.getMonth() + 1) + '月' + dt.getDate() + '日';
};
var items = base.map(function (b) {
var cur = loc[b.id] || 0;
var d = b.days[cur];
var soon = d <= 3;
return {
name: b.name, qty: b.qty,
exp: '还能放 ' + d + ' 天 · ' + dateOf(d) + ' 到期',
expStyle: 'font-size: 14px; ' + (soon ? 'color: #93400F;' : 'color: #3F4944;'),
locs: labels.map(function (l, i) {
var on = i === cur;
return {
label: l, checked: on ? 'true' : 'false',
style: 'height: 40px; border-radius: 10px; font-size: 14px; font-family: inherit; padding: 0; ' + (on ? 'border: 1.5px solid #2E7A4B; background: #E6F1EA; color: #245F3B; font-weight: 500;' : 'border: 1px solid #E3E6E0; background: #FFFFFF; color: #18201B;'),
pick: function () { var n = Object.assign({}, loc); n[b.id] = i; self.setState({ loc: n }); }
};
})
};
});
return { items: items };
}
}
</script>
</body>
</html>
