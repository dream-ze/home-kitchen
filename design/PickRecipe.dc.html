<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选菜加入菜单</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2E7A4B}a:hover{color:#245F3B}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F5F1; color: #18201B; font-family: 'PingFang SC', 'Noto Sans SC', -apple-system, sans-serif; position: relative; overflow: hidden">

<div aria-hidden="true" style="padding: 24px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 13px; color: #5B6660">10月19日 – 10月25日</span>
<span style="font-size: 30px; font-weight: 700">本周菜单</span>
</div>
<a href="WeekPlan.dc.html" aria-label="关闭选菜面板" style="position: absolute; inset: 0; background: rgba(20, 26, 22, 0.45)"></a>

<section aria-label="选菜" style="position: absolute; left: 0; right: 0; bottom: 0; top: 60px; background: #F4F5F1; border-radius: 24px 24px 0 0; display: flex; flex-direction: column">

<div aria-hidden="true" style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 40px; height: 5px; border-radius: 3px; background: #C9CFC6"></span></div>

<div style="display: flex; flex-direction: column; gap: 12px; padding: 10px 20px 0">
<div style="display: flex; justify-content: space-between; align-items: center">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">添加到 10月21日 周三</h1>
<a href="WeekPlan.dc.html" aria-label="关闭" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: flex-end; color: #5B6660">
<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</a>
</div>

<div role="tablist" aria-label="餐次" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #E7EAE4; border-radius: 12px; padding: 3px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
<button role="tab" aria-selected="{{s.selected}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
</sc-for>
</div>

<label style="height: 44px; border-radius: 12px; background: #FFFFFF; border: 1px solid #E3E6E0; display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #5B6660">
<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4.5 4.5"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜索菜谱</span>
<input type="search" placeholder="搜菜名或食材" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 15px; font-family: inherit; color: #18201B">
</label>

<div style="display: flex; gap: 8px">
<sc-for list="{{sorts}}" as="c" hint-placeholder-count="4">
<button aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="flex: 1; min-height: 0; overflow: hidden; padding: 12px 20px 0">
<div style="background: #FFFFFF; border-radius: 18px; padding: 0 14px; display: flex; flex-direction: column">
<sc-for list="{{recipes}}" as="r" hint-placeholder-count="5">
<div style="{{r.rowStyle}}">
<div aria-hidden="true" style="{{r.tileStyle}}">{{r.tile}}</div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 500">{{r.name}}</span>
<span style="{{r.subStyle}}">{{r.sub}}</span>
</div>
<button aria-pressed="{{r.pressed}}" aria-label="{{r.aria}}" onClick="{{r.toggle}}" style="{{r.btnStyle}}">{{r.btn}}</button>
</div>
</sc-for>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 20px 30px; background: #FFFFFF; border-top: 1px solid #E3E6E0">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 500">已选 {{count}} 道</span>
<span style="font-size: 12px; color: #5B6660">每道 2 份，加入后可单独改</span>
</div>
<a href="WeekPlan.dc.html" style="height: 50px; padding: 0 22px; border-radius: 14px; background: #2E7A4B; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; font-size: 16px; font-weight: 700">加入{{slotLabel}}</a>
</div>

</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { slot: 2, sort: 0, picked: { bc: true } };
}
renderVals() {
var self = this;
var st = this.state || {};
var slot = typeof st.slot === 'number' ? st.slot : 2;
var sort = typeof st.sort === 'number' ? st.sort : 0;
var picked = st.picked || {};
var slotLabels = ['早餐', '午餐', '晚餐', '加餐'];
var slots = slotLabels.map(function (l, i) {
var on = i === slot;
return {
label: l, selected: on ? 'true' : 'false',
style: 'height: 38px; border-radius: 10px; border: none; font-size: 14px; font-family: inherit; ' + (on ? 'background: #FFFFFF; color: #18201B; font-weight: 500;' : 'background: transparent; color: #5B6660;'),
pick: function () { self.setState({ slot: i }); }
};
});
var sortLabels = ['用到临期食材', '最近做过', '快手', '全部'];
var sorts = sortLabels.map(function (l, i) {
var on = i === sort;
return {
label: l, pressed: on ? 'true' : 'false',
style: 'height: 36px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-family: inherit; flex: none; ' + (on ? 'border: none; background: #18201B; color: #FFFFFF;' : 'border: 1px solid #D5DAD3; background: #FFFFFF; color: #18201B;'),
pick: function () { self.setState({ sort: i }); }
};
});
var tones = {
green: 'background: #E6F1EA; color: #245F3B;',
orange: 'background: #FBEDE3; color: #93400F;',
red: 'background: #F6DDD8; color: #9E2219;',
gray: 'background: #EEF0EC; color: #3F4944;',
blue: 'background: #E2E9EE; color: #2E4F66;'
};
var all = [
{ id: 'bc', name: '蒜蓉菠菜', tile: '菠', use: '用掉 菠菜', time: 10, kcal: 90, tone: 'green' },
{ id: 'nkc', name: '奶香烤鸡翅', tile: '翅', use: '用掉 鸡翅中、牛奶', time: 30, kcal: 380, tone: 'orange' },
{ id: 'ndd', name: '牛奶炖蛋', tile: '蛋', use: '用掉 牛奶', time: 15, kcal: 180, tone: 'orange' },
{ id: 'fq', name: '番茄炒蛋', tile: '番', last: '上周五做过', recent: 1, time: 10, kcal: 230, tone: 'red' },
{ id: 'dg', name: '冬瓜排骨汤', tile: '汤', last: '周一做过', recent: 0, time: 60, kcal: 260, tone: 'blue' },
{ id: 'cy', name: '葱油拌面', tile: '面', last: '10月8日做过', recent: 2, time: 15, kcal: 520, tone: 'gray' },
{ id: 'mp', name: '麻婆豆腐', tile: '豆', last: '9月底做过', recent: 3, time: 20, kcal: 300, tone: 'red' }
];
var list;
if (sort === 0) list = all.filter(function (r) { return r.use; }).concat(all.filter(function (r) { return !r.use; }));
else if (sort === 1) list = all.filter(function (r) { return typeof r.recent === 'number'; }).sort(function (a, b) { return a.recent - b.recent; });
else if (sort === 2) list = all.filter(function (r) { return r.time <= 15; });
else list = all;
list = list.slice(0, 6);
var count = 0;
Object.keys(picked).forEach(function (k) { if (picked[k]) count++; });
var recipes = list.map(function (r, i) {
var on = !!picked[r.id];
var lead = sort === 1 ? (r.last || r.use || '') : (r.use || r.last || '');
return {
name: r.name, tile: r.tile,
sub: (lead ? lead + ' · ' : '') + r.time + ' 分钟 · 约 ' + r.kcal + ' kcal',
subStyle: 'font-size: 12px; ' + (r.use && sort === 0 ? 'color: #93400F;' : 'color: #5B6660;'),
tileStyle: 'width: 46px; height: 46px; flex: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; ' + tones[r.tone],
rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 11px 0;' + (i < list.length - 1 ? ' border-bottom: 1px solid #ECEEEA;' : ''),
pressed: on ? 'true' : 'false',
aria: (on ? '取消选择 ' : '选择 ') + r.name,
btn: on ? '✓' : '+',
btnStyle: 'width: 40px; height: 40px; flex: none; border-radius: 20px; font-size: 18px; font-family: inherit; padding: 0; ' + (on ? 'border: none; background: #2E7A4B; color: #FFFFFF;' : 'border: 1.5px solid #2E7A4B; background: #FFFFFF; color: #2E7A4B;'),
toggle: function () { var n = Object.assign({}, picked); n[r.id] = !on; self.setState({ picked: n }); }
};
});
return { slots: slots, sorts: sorts, recipes: recipes, count: count, slotLabel: slotLabels[slot] };
}
}
</script>
</body>
</html>
