name = "shipu-ai"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# 用哪家模型在这里改，手机端不用动（SPEC §3、§6）。
#   AI_PROVIDER = "anthropic"          Claude，AI_MODEL 留空默认 claude-opus-5-5
#   AI_PROVIDER = "openai-compatible"  通义 / 豆包 / OpenAI 等，必须同时填 AI_BASE_URL 和 AI_MODEL
#   AI_PROVIDER = "mock"               不调用任何模型，返回固定的示例结果，用来本地测试
# 密钥不要写在这里，用命令设置：
#   npx wrangler secret put AI_KEY
#   npx wrangler secret put APP_TOKEN
[vars]
AI_PROVIDER = "mock"
AI_BASE_URL = ""
AI_MODEL = ""
